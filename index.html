
<!DOCTYPE html>
<html>
	<head>
	<title>Binary Switches</title>
	<meta name="author" content="Lucy Havok">
	<meta name="creator" content="Lucy Havok">
	<meta name="description" content="Small tool for easily and simply calculating binary values using switches for each place." lang=en>
	</head>
	<body>
		<table style="table-layout:fixed;width:32ch;text-align:center;">
			<tr>
				<th>Dec</th>
				<td>128</td>
				<td>64</td>
				<td>32</td>
				<td>16</td>
				<td>8</td>
				<td>4</td>
				<td>2</td>
				<td>1</td>
				<td id="fulldec" style="text-align:left !important;"></td>
			</tr>
			<tr>
				<th></th>
				<td><input type="checkbox" id="7sw" onchange="checkboxFlipped(this);"></td>
				<td><input type="checkbox" id="6sw" onchange="checkboxFlipped(this);"></td>
				<td><input type="checkbox" id="5sw" onchange="checkboxFlipped(this);"></td>
				<td><input type="checkbox" id="4sw" onchange="checkboxFlipped(this);"></td>
				<td><input type="checkbox" id="3sw" onchange="checkboxFlipped(this);"></td>
				<td><input type="checkbox" id="2sw" onchange="checkboxFlipped(this);"></td>
				<td><input type="checkbox" id="1sw" onchange="checkboxFlipped(this);"></td>
				<td><input type="checkbox" id="0sw" onchange="checkboxFlipped(this);"></td>
			</tr>
			<tr style="font-family:monospace;">
				<th>Bin</th>
				<td id="7st"></td>
				<td id="6st"></td>
				<td id="5st"></td>
				<td id="4st"></td>
				<td id="3st"></td>
				<td id="2st"></td>
				<td id="1st"></td>
				<td id="0st"></td>
				<td id="fullbin" style="text-align:left !important;"></td>
			</tr>
		<table>
		<script>
			let switchState = [0,0,0,0,0,0,0,0];


			function updateDatavalues() {
				switchState.forEach( (val, index) => {
					document.getElementById(index + "st").innerHTML = val;
				}
				);
				document.getElementById("fullbin").innerHTML = switchState.toReversed().join("");
				document.getElementById("fulldec").innerHTML = parseInt( switchState.toReversed().join(""), 2 );
			}
			updateDatavalues();

			function setSwitchState(id, value) {
				switchState[id] = value;
			}

			function checkboxFlipped(checkbox) {
				let arrayValue = checkbox.id.charAt(0);
				if (checkbox.checked == true) {
					setSwitchState(arrayValue, 1);
				} else if (checkbox.checked == false) {
					setSwitchState(arrayValue, 0);
				}
				updateDatavalues();
			}
		</script>
	</body>
</html>
